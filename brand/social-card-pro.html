<meta charset="utf-8">

@font-face{font-family:Inter;src:url(../mobile/assets/fonts/Inter.ttf);font-weight:100 900}

html,body{margin:0}
.card{width:1200px;height:630px;box-sizing:border-box;background:#0F2A14;color:#EAF7D6;font-family:Inter,sans-serif;

.pro{color:#A3E635;font-size:30px;letter-spacing:.2em}
h1{font-family:Archivo,sans-serif;font-weight:700;text-transform:uppercase;font-size:86px;line-height:.98;color:#fff;margin:34px 0 20px;letter-spacing:.01em}
h1 em{font-style:normal;color:#A3E635}
p{font-size:26px;line-height:1.38;margin:0;max-width:40ch;opacity:.92}
.url{position:absolute;left:60px;bottom:48px;font-family:Mono,monospace;font-size:26px;color:#A3E635}
svg{width:100%;height:100%;border-radius:22px;background:#DFE7D8}
