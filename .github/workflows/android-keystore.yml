name: Android keystore (Plazo upload key)

# Creates the Android upload keystore of Plazo and Plazo Pro and puts it into Codemagic (11/10/2026, « génère une clé
# pour plazo et plazo pro » then « fais-le »), WITHOUT the key or its password ever going through a conversation or
# the repository:
#   1. the keystore is generated here with a random password;
#   2. with the repository secret CODEMAGIC_API_TOKEN (Codemagic › Teams › Personal account › Integrations › Codemagic API, pasted
#      once in GitHub › Settings › Secrets and variables › Actions), .github/scripts/codemagic_keystore.py sends it,
#      base64-encoded, to the SECURE variables of the Codemagic app's group « plazo_android_signing » (CM_KEYSTORE,
#      CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD; codemagic.yaml decodes them: Codemagic has no API for
#      its Code signing identities) and queues the « mobile-release-android » build on main;
#   3. the files also wait in a workflow artifact for ONE day, for the password manager only (Codemagic never gives
#      a keystore back, and Google Play wants the same key for every later upload). Joanny downloads it from the
#      run's page (Artifacts › plazo-upload-keystore), stores it, then deletes the artifact (bin icon next to it).
# Nothing secret is logged: only ids, URLs and the certificate's SHA-256 fingerprint.
#
# Start it by hand only: Actions › « Android keystore (Plazo upload key) » › Run workflow. Run it ONCE: an upload key
# is fixed by the first AAB imported in the Play Console, so the script refuses to overwrite a key already in the
# group unless « replace » is ticked; after a first import, a new key means asking Google for an upload key reset
# (mobile/publier-sur-les-stores.md, step 3.2). Without CODEMAGIC_API_TOKEN, only the artifact is produced.
on:
  workflow_dispatch:
    inputs:
      replace:
        description: "Remplacer une clé déjà dans Codemagic (seulement si aucun AAB n'a encore été importé sur Google Play)"
        type: boolean
        default: false
      start_build:
        description: "Lancer ensuite le build Codemagic « Android seul » sur main"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    env:
      CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate the keystore (random password, never printed)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out
          # 32 letters and digits (Codemagic and Gradle take them without escaping).
          PW=$(openssl rand -base64 64 | tr -dc 'A-Za-z0-9' | head -c 32)
          [ "${#PW}" -eq 32 ]
          echo "::add-mask::$PW"
          # One key for both apps (alias « upload »), the same password for the store and the key, 27 years.
          keytool -genkeypair -keystore out/plazo-upload.jks -storetype JKS -keyalg RSA -keysize 2048 \
            -validity 10000 -alias upload -storepass "$PW" -keypass "$PW" \
            -dname "CN=Plazo, O=Benford Tech, C=FR" 2>/dev/null
          echo "::add-mask::$(base64 -w0 out/plazo-upload.jks)"
          # The public certificate: what Google asks for an upload key reset, never secret.
          keytool -export -rfc -keystore out/plazo-upload.jks -alias upload -storepass "$PW" \
            -file out/upload_certificate.pem 2>/dev/null
          printf '%s' "$PW" > out/plazo-upload-password.txt
          cat > out/LISEZ-MOI.txt <<'EOF'
          Clé d'import Android de Plazo et Plazo Pro (une seule clé pour les deux apps).

          plazo-upload.jks           la clé (à garder pour toujours : Codemagic ne la rend jamais)
          plazo-upload-password.txt  son mot de passe (le même pour le fichier et pour la clé)
          upload_certificate.pem     le certificat public, pour une réinitialisation chez Google plus tard

          Le workflow GitHub a déjà envoyé la clé à Codemagic (groupe de variables plazo_android_signing)
          quand le secret CODEMAGIC_API_TOKEN existait ; sinon, la téléverser à la main :
            Codemagic › Teams › Personal account › Code signing identities › Android keystores › Upload keystore
              Keystore file      plazo-upload.jks
              Keystore password  le mot de passe
              Key alias          upload
              Key password       le même mot de passe
              Reference name     plazo_upload
            puis demander à Claude de remettre `android_signing: [plazo_upload]` dans codemagic.yaml.

          À faire dans tous les cas :
          1. Mettre le .jks et le mot de passe dans le gestionnaire de mots de passe.
          2. Supprimer cet artefact sur la page du run GitHub (icône de corbeille), puis les fichiers téléchargés.
          EOF
          echo "Keystore ready. Certificate fingerprint (public):"
          keytool -list -v -keystore out/plazo-upload.jks -storepass "$PW" 2>/dev/null | grep -E 'SHA256:' | head -1
      - name: Send it to Codemagic (secure variables of plazo_android_signing) and start the Android build
        if: env.CODEMAGIC_API_TOKEN != ''
        env:
          KEYSTORE_DIR: out
          REPLACE: ${{ inputs.replace }}
          START_BUILD: ${{ inputs.start_build }}
        run: python3 .github/scripts/codemagic_keystore.py
      - name: No Codemagic token
        if: env.CODEMAGIC_API_TOKEN == ''
        run: |
          echo "::warning::Pas de secret CODEMAGIC_API_TOKEN : la clé n'a pas été envoyée à Codemagic (voir LISEZ-MOI.txt dans l'artefact)."
          echo "- Pas de secret \`CODEMAGIC_API_TOKEN\` : clé non envoyée à Codemagic, à téléverser à la main (LISEZ-MOI.txt)." >> "$GITHUB_STEP_SUMMARY"
      - name: Keep it one day, for the password manager
        uses: actions/upload-artifact@v4
        with:
          name: plazo-upload-keystore
          path: out/
          retention-days: 1
          if-no-files-found: error
          # The archive holds a secret: no compression trick, just the files.
          compression-level: 0
