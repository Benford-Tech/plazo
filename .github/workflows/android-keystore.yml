name: Android keystore (Plazo upload key)

# Creates the Android upload keystore of Plazo and Plazo Pro (11/10/2026, « génère une clé pour plazo et plazo pro »),
# WITHOUT the key or its password ever going through a conversation or the repository: this job generates the keystore
# with a random password and leaves both in a workflow artifact that only the people with access to this repository can
# download, for ONE day. Joanny downloads it from the run's page (Artifacts › plazo-upload-keystore), uploads the .jks
# to Codemagic (Team settings › Code signing identities › Android keystores, reference « plazo_upload »), stores the
# file and the password in the password manager, then deletes the artifact (bin icon next to it). Codemagic has no API
# for keystores, so that upload stays by hand. Nothing here is logged, except the certificate's SHA-256 fingerprint,
# which is not a secret.
#
# Start it by hand only: Actions › « Android keystore (Plazo upload key) » › Run workflow. Run it ONCE: an upload key is
# fixed by the first AAB imported in the Play Console; a new key afterwards means asking Google for an upload key reset
# (mobile/publier-sur-les-stores.md, step 3.2).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate the keystore (random password, never printed)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out
          # 32 letters and digits (Codemagic and Gradle take them without escaping).
          PW=$(openssl rand -base64 64 | tr -dc 'A-Za-z0-9' | head -c 32)
          [ "${#PW}" -eq 32 ]
          echo "::add-mask::$PW"
          # One key for both apps (alias « upload »), the same password for the store and the key, 27 years.
          keytool -genkeypair -keystore out/plazo-upload.jks -storetype JKS -keyalg RSA -keysize 2048 \
            -validity 10000 -alias upload -storepass "$PW" -keypass "$PW" \
            -dname "CN=Plazo, O=Benford Tech, C=FR" 2>/dev/null
          # The public certificate: what Google asks for an upload key reset, never secret.
          keytool -export -rfc -keystore out/plazo-upload.jks -alias upload -storepass "$PW" \
            -file out/upload_certificate.pem 2>/dev/null
          printf '%s' "$PW" > out/plazo-upload-password.txt
          cat > out/LISEZ-MOI.txt <<'EOF'
          Clé d'import Android de Plazo et Plazo Pro (une seule clé pour les deux apps).

          plazo-upload.jks           la clé (à garder pour toujours : Codemagic ne la rend jamais)
          plazo-upload-password.txt  son mot de passe (le même pour le fichier et pour la clé)
          upload_certificate.pem     le certificat public, pour une réinitialisation chez Google plus tard

          À faire :
          1. Mettre le .jks et le mot de passe dans le gestionnaire de mots de passe.
          2. Codemagic › Team settings › Code signing identities › Android keystores › Upload keystore :
               Keystore file      plazo-upload.jks
               Keystore password  le mot de passe
               Key alias          upload
               Key password       le même mot de passe
               Reference name     plazo_upload   (exactement)
          3. Supprimer cet artefact sur la page du run GitHub (icône de corbeille), puis les fichiers téléchargés.
          EOF
          echo "Keystore ready. Certificate fingerprint (public):"
          keytool -list -v -keystore out/plazo-upload.jks -storepass "$PW" 2>/dev/null | grep -E 'SHA256:' | head -1
      - name: Keep it one day, for Joanny only
        uses: actions/upload-artifact@v4
        with:
          name: plazo-upload-keystore
          path: out/
          retention-days: 1
          if-no-files-found: error
          # The archive holds a secret: no compression trick, just the files.
          compression-level: 0
