name: Nouveaux parkings (annuaire des entreprises)

# Finds the car parks opened lately around airports in the State's company directory (activity 52.21Z, new company or
# new establishment, open, within the radius) and adds them to Plateforme › Prospection (22/11/2026, « comment trouver
# les parking avec navette qui vienne d'ouvrir ? »). By default a preview only; « appliquer » writes. The server leaves out
# a prospect already listed or opted out. Nothing is ever sent: the mails leave only from the page. Secrets:
# PLAZO_ADMIN_EMAIL / PLAZO_ADMIN_PASSWORD (a platform admin). By hand only (.github/scripts/new_parkings.py).
# Second source (22/11/2026, « comment trouver les parking avec navette qui vont ouvrir ? » → « oui »): the BODACC creation
# notices whose declared activity says parking and airport, shuttle or valet, often before the car park opens.
on:
  workflow_dispatch:
    inputs:
      appliquer:
        description: "Ajouter les parkings trouvés à la Prospection (sinon un aperçu seulement)"
        type: boolean
        default: false
      source:
        description: "Où chercher"
        type: choice
        options: ["tous", "bodacc", "annuaire"]
        default: "tous"
      aeroports:
        description: "Codes des aéroports (LYS, ou LYS,GNB,CMF), ou « tous »"
        type: string
        default: "LYS"
      mois:
        description: "Créés depuis combien de mois"
        type: string
        default: "12"
      rayon_km:
        description: "Distance de l'aéroport (km)"
        type: string
        default: "15"

permissions:
  contents: read

concurrency:
  group: prospects-import
  cancel-in-progress: false

jobs:
  new-parkings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Recherche dans l'annuaire des entreprises
        env:
          PLAZO_ADMIN_EMAIL: ${{ secrets.PLAZO_ADMIN_EMAIL }}
          PLAZO_ADMIN_PASSWORD: ${{ secrets.PLAZO_ADMIN_PASSWORD }}
          APPLY: ${{ inputs.appliquer }}
          SOURCE: ${{ inputs.source }}
          AIRPORTS: ${{ inputs.aeroports }}
          MONTHS: ${{ inputs.mois }}
          RADIUS_KM: ${{ inputs.rayon_km }}
        run: python3 .github/scripts/new_parkings.py
