name: Données fictives du parking de test

# Fills the platform's own test operator « Plazo (tests) » in production with a fictional day around the moment of
# the run (12/10/2026): shuttle tracking on « Équipe et clients », a shuttle vehicle, 8 bookings (2 cars on site for
# the shuttle to the terminal, 2 arrivals later today, 2 returns today, 2 arrivals tomorrow), through the API and its
# rules. For filming Plazo Pro (Google Play foreground-service videos), a demo or a check before a store review.
# Fictional people only, no e-mail, phones in the 06 39 98 range, no day-before SMS. Refuses any other operator.
# Run again to refresh the day (nothing piles up); « clear » closes the fictional bookings.
# Secrets (Settings › Secrets and variables › Actions): PLAZO_TEST_EMAIL and PLAZO_TEST_PASSWORD, a manager of
# « Plazo (tests) ». Nothing secret is printed. By hand only (.github/scripts/test_parking_data.py).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "fill : préparer la journée fictive (ou la remettre à l'heure) · clear : clôturer les réservations fictives"
        type: choice
        options: [fill, clear]
        default: fill

permissions:
  contents: read

concurrency:
  group: test-parking-data
  cancel-in-progress: false

jobs:
  test-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Données fictives
        env:
          PLAZO_TEST_EMAIL: ${{ secrets.PLAZO_TEST_EMAIL }}
          PLAZO_TEST_PASSWORD: ${{ secrets.PLAZO_TEST_PASSWORD }}
          ACTION: ${{ inputs.action }}
        run: python3 .github/scripts/test_parking_data.py
