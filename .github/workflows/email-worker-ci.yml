name: Email worker CI

on:
  pull_request:
    paths: ['email-worker/**', '.github/workflows/email-worker-ci.yml']
  push:
    branches: [main]
    paths: ['email-worker/**', '.github/workflows/email-worker-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: email-worker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: email-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Deploys the Worker "plazo" to Cloudflare on every push to main (and by hand with "Run workflow"), with the
  # secrets CLOUDFLARE_API_TOKEN (token "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID of the "Production"
  # environment. Without them the job says so and skips: the Cloudflare side keeps what it has.
  # The Worker's own settings come from the same environment, never from the Cloudflare dashboard: a deploy
  # overrides what the dashboard holds (08/10/2026: FALLBACK_ADDRESS and the logs were wiped by a deploy, and the
  # inbound secret went missing). INBOUND_EMAIL_SECRET (secret, same value as on Vercel) is put on the Worker after
  # each deploy; FALLBACK_ADDRESS (variable, optional) is passed to the deploy; the job fails when the Worker ends
  # up without its secret, since every email would then be refused.
  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The two secrets live in the repository's "Production" environment (GitHub › Settings › Environments).
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - name: Check the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set in the Production environment, deploy skipped."
          fi
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: email-worker/package-lock.json
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'
      - name: Deploy to Cloudflare
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FALLBACK_ADDRESS: ${{ vars.FALLBACK_ADDRESS }}
        run: |
          if [ -n "$FALLBACK_ADDRESS" ]; then
            npx wrangler deploy --var "FALLBACK_ADDRESS:$FALLBACK_ADDRESS"
          else
            npx wrangler deploy
          fi
      - name: Put the inbound secret on the Worker
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INBOUND_EMAIL_SECRET: ${{ secrets.INBOUND_EMAIL_SECRET }}
        run: |
          if [ -n "$INBOUND_EMAIL_SECRET" ]; then
            printf '%s' "$INBOUND_EMAIL_SECRET" | npx wrangler secret put INBOUND_EMAIL_SECRET
          else
            echo "::notice::INBOUND_EMAIL_SECRET is not set in the Production environment: the Worker keeps the secret it has, if any."
          fi
      - name: Check that the Worker has its secret
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx wrangler secret list | grep -q '"INBOUND_EMAIL_SECRET"'; then
            echo "INBOUND_EMAIL_SECRET is set on the Worker."
          else
            echo "::error::The Worker has no INBOUND_EMAIL_SECRET, so every email is refused. Add the secret INBOUND_EMAIL_SECRET (the value set on Vercel) to GitHub › Settings › Environments › Production, then run this workflow again."
            exit 1
          fi
