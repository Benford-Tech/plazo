name: Email worker CI

on:
  pull_request:
    paths: ['email-worker/**', '.github/workflows/email-worker-ci.yml']
  push:
    branches: [main]
    paths: ['email-worker/**', '.github/workflows/email-worker-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: email-worker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: email-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Deploys the Worker "plazo" to Cloudflare on every push to main (and by hand with "Run workflow"), with the
  # repository secrets CLOUDFLARE_API_TOKEN (token "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID. Without
  # them the job says so and skips: the Cloudflare side keeps what it has.
  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets missing
        if: env.HAS_CLOUDFLARE_SECRETS != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set in the repository secrets, deploy skipped."
      - uses: actions/setup-node@v4
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: email-worker/package-lock.json
      - run: npm ci
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
      - name: Deploy to Cloudflare
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: email-worker
          wranglerVersion: '4.148.0'
