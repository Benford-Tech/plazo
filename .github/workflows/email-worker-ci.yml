name: Email worker CI

on:
  pull_request:
    paths: ['email-worker/**', '.github/workflows/email-worker-ci.yml']
  push:
    branches: [main]
    paths: ['email-worker/**', '.github/workflows/email-worker-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: email-worker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: email-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Deploys the Worker "plazo" to Cloudflare on every push to main (and by hand with "Run workflow"), with the
  # secrets CLOUDFLARE_API_TOKEN (token "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID of the "Production"
  # environment. Without them the job says so and skips: the Cloudflare side keeps what it has.
  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The two secrets live in the repository's "Production" environment (GitHub › Settings › Environments).
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - name: Check the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set in the Production environment, deploy skipped."
          fi
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: email-worker/package-lock.json
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'
      - name: Deploy to Cloudflare
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: email-worker
          wranglerVersion: '4.148.0'
