name: Email worker CI

on:
  pull_request:
    paths: ['email-worker/**', '.github/workflows/email-worker-ci.yml']
  push:
    branches: [main]
    paths: ['email-worker/**', '.github/workflows/email-worker-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: email-worker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: email-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
