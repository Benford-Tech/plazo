name: Backend CI

on:
  pull_request:
    paths: ['backend/**', 'product.json', '.github/workflows/backend-ci.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'product.json', '.github/workflows/backend-ci.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: plazo
          POSTGRES_PASSWORD: plazo
          POSTGRES_DB: plazo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U plazo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://plazo:plazo@localhost:5432/plazo_test
      DIRECT_URL: postgresql://plazo:plazo@localhost:5432/plazo_test
      DATABASE_URL_TEST: postgresql://plazo:plazo@localhost:5432/plazo_test
      CRON_SECRET: ci-cron-secret
      SECRET_KEY: ci-secret
      CLIENT_URL: http://localhost:8080
      PORT: 3005
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
