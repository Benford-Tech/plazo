# Cloudflare Email Worker of Plazo: Email Routing sends it every email addressed to <slug>@in.plazo.fr
# (catch-all rule "Send to a Worker"); it posts the email to the Plazo API. See README.md.
name = "plazo-email-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

[vars]
PLAZO_INBOUND_URL = "https://www.plazo.fr/api/public/inbound/email"
# Optional: a verified Email Routing destination that keeps the email when Plazo cannot take it.
# FALLBACK_ADDRESS = "contact@example.com"

# Secret, set in the dashboard (Settings › Variables and Secrets) or with `npx wrangler secret put INBOUND_EMAIL_SECRET`:
# INBOUND_EMAIL_SECRET — the same value as INBOUND_EMAIL_SECRET on Vercel.
