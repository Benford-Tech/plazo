# Codemagic CI/CD — mobile apps: Plazo (flavor traveller) and Plazo Pro (flavor pro), one project.
#
# 09/10/2026: Plazo joins the Codemagic TEAM that already publishes Thempo, LoveNest and Yoon, and signs the
# way Thempo does (Benford-Tech/tempo-app, codemagic.yaml, published on both stores from that team):
#   - Apple: the team's Developer Portal integration « lovenest-asc » (App Store Connect API key of the
#     Apple team 3BX4795V2Y, Benford Tech) and the Apple Distribution certificate already uploaded in the
#     team's Code signing identities (Apple allows 3 per account: never create one more for Plazo);
#   - Android: Plazo's own upload keystore, uploaded as a FILE in the team's Code signing identities under
#     the reference plazo_upload (never base64 pasted by hand: LoveNest's got truncated);
#   - public build settings (OneSignal app ids, as in Vercel) written here, the one secret of the app's
#     group « mobile_secrets » being the Google Play service account key.
# NO SECRET IN THIS FILE. Step by step: mobile/publier-sur-les-stores.md.
#
# The repository is a monorepo: Codemagic reads this file at the repository root and every workflow runs in
# mobile/ (working_directory). The checks of every push run on GitHub Actions (.github/workflows/mobile-ci.yml,
# free), not here: a team's Codemagic minutes are billed.
#
# Workflows (one per store and per app, so that Google Play does not wait for Apple):
#   mobile-check               → by hand only: checks + DEBUG Android APKs of the two apps, to install.
#   plazo-android-release      → Plazo (voyageurs): signed AAB → Google Play, internal track.
#   plazo-ios-release          → Plazo (voyageurs): signed IPA → TestFlight (internal testers).
#   plazo-pro-android-release  → Plazo Pro (personnel): same as plazo-android-release, flavor `pro`.
#   plazo-pro-ios-release      → Plazo Pro (personnel): same as plazo-ios-release, flavor `pro`.
# The four release workflows start on a tag `mobile-vX.Y.Z` whose version is the `version:` of
# mobile/pubspec.yaml (checked), or by hand from Codemagic (Start new build). Until the Apple profiles exist,
# start the two Android ones by hand instead of tagging: the iOS ones would fail at signing.
#
# Build number = Codemagic build counter + 100 (the counter only grows), and never below the last build already
# on the store of the workflow.
#
# ── To set up once (detail: mobile/publier-sur-les-stores.md) ─────────────────────────────────────
#   Add the app to the existing team (the one of Thempo), from GitHub, with codemagic.yaml; check that
#   pushes and tags reach it (app → Webhooks).
#   Team › Code signing identities: Android keystore « plazo_upload » (Plazo's own); iOS provisioning
#   profiles of the two bundle ids, made in the Apple portal with the team's existing Apple Distribution
#   certificate, then « Fetch profiles ».
#   App › Environment variables, group « mobile_secrets »:
#     GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS = JSON key of the Google Cloud service account that already
#                                               publishes Thempo, given access to both Plazo apps in Play
#                                               Console › Users and permissions (Releases permissions)
#     API_BASE_URL / SITE_URL                 = optional (https://www.plazo.fr/api is the app's default)
#     STRIPE_MERCHANT_ID                      = optional, Apple Pay merchant id, only once the Apple Pay
#                                               entitlement is in ios/Runner/Runner.entitlements
#   The first upload of each app to Google Play is done by hand in the Play Console, with the .aab of a
#   first run of its Android workflow (Artifacts); that run ends red at publishing ("Package not found").
# ────────────────────────────────────────────────────────────────────────────────────────────────

# ── Shared pieces (YAML anchors) ───────────────────────────────────────────────────────────────
definitions:
  env_versions: &env_versions
    # Same Flutter as the local checks and mobile-ci.yml (stable, October 2026).
    flutter: 3.47.6
    xcode: latest
    java: 17
    cocoapods: default

  # Billed minutes: keep the Gradle, pub and CocoaPods downloads between builds.
  cache: &cache
    cache_paths:
      - ~/.gradle/caches
      - $FLUTTER_ROOT/.pub-cache
      - $HOME/Library/Caches/CocoaPods

  triggering_release: &triggering_release
    events:
      - tag
    tag_patterns:
      - pattern: 'mobile-v*'
        include: true
    cancel_previous_builds: true

  scripts:
    - &android_key_properties
      name: key.properties depuis la clé d'import (Code signing identities)
      # android_signing exposes CM_KEYSTORE_PATH / CM_KEYSTORE_PASSWORD / CM_KEY_ALIAS / CM_KEY_PASSWORD;
      # android/app/build.gradle.kts reads this file.
      script: |
        set -e
        [ -n "$CM_KEYSTORE_PATH" ] && [ -s "$CM_KEYSTORE_PATH" ] \
          || { echo "ERREUR: clé d'import « plazo_upload » absente de Team › Code signing identities › Android"; exit 1; }
        cat > "$CM_BUILD_DIR/mobile/android/key.properties" <<EOF
        storeFile=$CM_KEYSTORE_PATH
        storePassword=$CM_KEYSTORE_PASSWORD
        keyAlias=$CM_KEY_ALIAS
        keyPassword=$CM_KEY_PASSWORD
        EOF
        echo "Clé d'import prête"
    - &compute_version
      name: Calculer la version (jamais en dessous du store)
      script: |
        set -e
        VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
        # A tag names the version it publishes: mobile-v1.2.0 must match `version: 1.2.0+…` in pubspec.yaml.
        if [ -n "$CM_TAG" ] && [ "$CM_TAG" != "mobile-v$VERSION_NAME" ]; then
          echo "ERREUR: le tag $CM_TAG ne correspond pas à la version $VERSION_NAME de pubspec.yaml"; exit 1
        fi
        NEXT=$((PROJECT_BUILD_NUMBER + 100))
        # Never reuse a build number the store already knows (a re-run, a build made elsewhere).
        PLAY=0
        [ -n "$ANDROID_APPLICATION_ID" ] && PLAY=$(google-play get-latest-build-number --package-name "$ANDROID_APPLICATION_ID" 2>/dev/null || echo 0)
        TF=0
        [ -n "$APP_STORE_APP_ID" ] && [ "$APP_STORE_APP_ID" != "0" ] && TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
        for LAST in "$PLAY" "$TF"; do
          case "$LAST" in ''|*[!0-9]*) LAST=0 ;; esac
          [ "$LAST" -ge "$NEXT" ] && NEXT=$((LAST + 1))
        done
        echo "Version: $VERSION_NAME ($NEXT) — Google Play $PLAY, TestFlight $TF"
        echo "NEXT=$NEXT" >> "$CM_ENV"
        echo "VERSION_NAME=$VERSION_NAME" >> "$CM_ENV"
        # Build-time settings (never secrets: they ship in the app).
        [ -n "$ONESIGNAL_APP_ID" ] || echo "ATTENTION: pas d'app OneSignal pour $FLAVOR, les notifications de cette version seront coupées"
        DEFINES="--dart-define=APP_FLAVOR=$FLAVOR --dart-define=ONESIGNAL_APP_ID=$ONESIGNAL_APP_ID"
        [ -n "$API_BASE_URL" ] && DEFINES="$DEFINES --dart-define=API_BASE_URL=$API_BASE_URL"
        [ -n "$SITE_URL" ] && DEFINES="$DEFINES --dart-define=SITE_URL=$SITE_URL"
        [ -n "$STRIPE_MERCHANT_ID" ] && DEFINES="$DEFINES --dart-define=STRIPE_MERCHANT_ID=$STRIPE_MERCHANT_ID"
        echo "DEFINES=$DEFINES" >> "$CM_ENV"
    - &flutter_packages
      name: Flutter packages
      script: flutter pub get
    - &checks
      name: Vérifications (nom du produit, analyse, tests)
      script: |
        set -e
        dart run tool/sync_product.dart --check
        flutter analyze
        flutter test
    - &build_android
      name: Android — App Bundle (Play) + APK (release, signés, versionnés)
      script: |
        set -e
        flutter build appbundle --release --flavor "$FLAVOR" --build-number="$NEXT" $DEFINES
        flutter build apk --release --flavor "$FLAVOR" --build-number="$NEXT" $DEFINES
        mv "build/app/outputs/bundle/${FLAVOR}Release/app-$FLAVOR-release.aab" "build/app/outputs/bundle/${FLAVOR}Release/$APP_SLUG-v$VERSION_NAME-$NEXT.aab"
        mv "build/app/outputs/flutter-apk/app-$FLAVOR-release.apk" "build/app/outputs/flutter-apk/$APP_SLUG-v$VERSION_NAME-$NEXT.apk"
    - &ios_profiles
      name: Profils de signature dans le projet Xcode
      # ios_signing has put the team's certificate and the App Store profile of the bundle id in the keychain;
      # the App ID needs Push Notifications (both apps) and Associated Domains (Plazo only).
      script: xcode-project use-profiles
    - &build_ios
      name: iOS — IPA signé (release, versionné)
      script: |
        set -e
        flutter build ipa --release --flavor "$FLAVOR" --build-number="$NEXT" $DEFINES \
          --export-options-plist=/Users/builder/export_options.plist
        mv build/ios/ipa/*.ipa "build/ios/ipa/$APP_SLUG-v$VERSION_NAME-$NEXT.ipa"

  android_scripts: &android_scripts
    - *android_key_properties
    - *compute_version
    - *flutter_packages
    - *checks
    - *build_android

  ios_scripts: &ios_scripts
    - *compute_version
    - *flutter_packages
    - *checks
    - *ios_profiles
    - *build_ios

  android_artifacts: &android_artifacts
    - build/app/outputs/bundle/*/*.aab
    - build/app/outputs/flutter-apk/*.apk
    - build/app/outputs/mapping/*/mapping.txt

  ios_artifacts: &ios_artifacts
    - build/ios/ipa/*.ipa
    - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  # Only when every step passed. Each store receives a test version (Google Play internal track, TestFlight);
  # promotion to production stays a human decision in each console.
  google_play_publishing: &google_play_publishing
    google_play:
      credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
      track: internal
      # true until each app has been published once on Google Play (the API refuses a live release
      # before that); then false so the internal release goes live to the testers by itself.
      submit_as_draft: true

  testflight_publishing: &testflight_publishing
    app_store_connect:
      auth: integration
      # Internal testers get every build. No beta review for external testers yet: it needs its own test
      # information and a reviewer account, and stalled Thempo; turn it on with beta_groups for the client's staff.
      submit_to_testflight: false
      submit_to_app_store: false

# ── Workflows ──────────────────────────────────────────────────────────────────────────────────
workflows:
  mobile-check:
    name: Mobile — vérifications + APK de test (debug, à la main)
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: mobile
    environment:
      <<: *env_versions
    cache: *cache
    # No triggering: started by hand when test APKs are wanted (the push checks run on GitHub Actions).
    scripts:
      - *flutter_packages
      - *checks
      - name: Android — APK de test des deux apps (debug, non signés pour le store)
        script: |
          set -e
          flutter build apk --debug --flavor traveller --dart-define=APP_FLAVOR=traveller
          flutter build apk --debug --flavor pro --dart-define=APP_FLAVOR=pro
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  plazo-android-release:
    name: Plazo (voyageurs) — Google Play, tests internes
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    environment:
      <<: *env_versions
      android_signing:
        # Team › Code signing identities › Android keystores: Plazo's upload key (both apps).
        - plazo_upload
      groups:
        - mobile_secrets
      vars:
        FLAVOR: traveller
        APP_SLUG: plazo
        # Identifier of the traveller app (android/app/build.gradle.kts).
        ANDROID_APPLICATION_ID: com.benfordtech.parking_app
        # OneSignal app of Plazo (public, the same as ONESIGNAL_TRAVELLER_APP_ID on Vercel).
        ONESIGNAL_APP_ID: dd3c2a74-a7b0-4117-ba18-ab5a1edfe0a3
        # R8 runs out of heap on Codemagic machines (org.gradle.jvmargs is ignored there).
        JAVA_TOOL_OPTIONS: "-Xmx5g"
    cache: *cache
    triggering: *triggering_release
    scripts: *android_scripts
    artifacts: *android_artifacts
    publishing: *google_play_publishing

  plazo-ios-release:
    name: Plazo (voyageurs) — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: mobile
    integrations:
      # Team › Integrations › Developer Portal: the App Store Connect API key of the Apple team (shared with
      # LoveNest and Thempo). Signs with the team's certificate and publishes.
      app_store_connect: lovenest-asc
    environment:
      <<: *env_versions
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.benfordtech.parkingApp
      groups:
        - mobile_secrets
      vars:
        FLAVOR: traveller
        APP_SLUG: plazo
        # OneSignal app of Plazo (public, the same as ONESIGNAL_TRAVELLER_APP_ID on Vercel).
        ONESIGNAL_APP_ID: dd3c2a74-a7b0-4117-ba18-ab5a1edfe0a3
        # PLACEHOLDER: numeric Apple ID of the app in App Store Connect (App Information → Apple ID),
        # used only to read the last TestFlight build number ("0" = not read).
        APP_STORE_APP_ID: "0"
    cache: *cache
    triggering: *triggering_release
    scripts: *ios_scripts
    artifacts: *ios_artifacts
    publishing: *testflight_publishing

  plazo-pro-android-release:
    name: Plazo Pro (personnel) — Google Play, tests internes
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    environment:
      <<: *env_versions
      android_signing:
        - plazo_upload
      groups:
        - mobile_secrets
      vars:
        FLAVOR: pro
        APP_SLUG: plazo-pro
        # Identifier of the staff app (flavor pro).
        ANDROID_APPLICATION_ID: com.benfordtech.parking_app.pro
        # OneSignal app of Plazo Pro (public, the same as ONESIGNAL_APP_ID on Vercel).
        ONESIGNAL_APP_ID: 89a1124f-3ba0-481e-b9f1-545d254e435d
        JAVA_TOOL_OPTIONS: "-Xmx5g"
    cache: *cache
    triggering: *triggering_release
    scripts: *android_scripts
    artifacts: *android_artifacts
    publishing: *google_play_publishing

  plazo-pro-ios-release:
    name: Plazo Pro (personnel) — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: mobile
    integrations:
      app_store_connect: lovenest-asc
    environment:
      <<: *env_versions
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.benfordtech.parkingApp.pro
      groups:
        - mobile_secrets
      vars:
        FLAVOR: pro
        APP_SLUG: plazo-pro
        # OneSignal app of Plazo Pro (public, the same as ONESIGNAL_APP_ID on Vercel).
        ONESIGNAL_APP_ID: 89a1124f-3ba0-481e-b9f1-545d254e435d
        # PLACEHOLDER: numeric Apple ID of Plazo Pro in App Store Connect.
        APP_STORE_APP_ID: "0"
    cache: *cache
    triggering: *triggering_release
    scripts: *ios_scripts
    artifacts: *ios_artifacts
    publishing: *testflight_publishing
