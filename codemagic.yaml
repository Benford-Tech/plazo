# Codemagic CI/CD — mobile apps: Plazo (flavor traveller) and Plazo Pro (flavor pro), one project.
#
# 09/10/2026: Plazo joins the Codemagic ACCOUNT that already publishes Thempo, LoveNest and Yoon, and signs the
# way Thempo does (Benford-Tech/tempo-app, codemagic.yaml, published on both stores from that account).
# 11/10/2026: that account is Joanny's PERSONAL Codemagic account, not a team (the API lists no team; its apps
# are lovenest-frontend, tempo-app, yoon and plazo): 500 free Mac mini M2 minutes a month, ONE build at a
# time, Linux and Windows only once billing is enabled (codemagic.io/billing/user), and Codemagic cancels a
# build queued for 5 hours. Its settings live under Codemagic › Teams › Personal account.
#   - Apple: the account's Developer Portal integration « lovenest-asc » (App Store Connect API key of the
#     Apple team 3BX4795V2Y, Benford Tech) and the Apple Distribution certificate already uploaded in the
#     account's Code signing identities (Apple allows 3 per account: never create one more for Plazo);
#   - Android: Plazo's own upload keystore, created by the GitHub workflow « Android keystore (Plazo upload
#     key) » (.github/workflows/android-keystore.yml, 11/10/2026: the key and its password never go through a
#     conversation), which sends it through the Codemagic API (there is none for Code signing identities)
#     to the SECURE variables of this app's group « plazo_android_signing »: CM_KEYSTORE (base64 of the
#     .jks), CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD, decoded by the key.properties step below
#     (a base64 sent by API is never truncated, unlike LoveNest's pasted by hand);
#   - public build settings (OneSignal app ids, as in Vercel) written here, the one secret of the app's
#     group « mobile_secrets » being the Google Play service account key.
# NO SECRET IN THIS FILE. Step by step: mobile/publier-sur-les-stores.md.
#
# The repository is a monorepo: Codemagic reads this file at the repository root and every workflow runs in
# mobile/ (working_directory). The checks of every push run on GitHub Actions (.github/workflows/mobile-ci.yml,
# free), not here: the account's 500 free Codemagic minutes a month are kept for the store builds.
#
# 11/10/2026, « unifie le pipeline »: ONE release workflow builds the six packages of a version and sends them
# to the stores, instead of four workflows (one per store and per app):
#   mobile-check    → by hand only: checks + DEBUG Android APKs of the two apps, to install and try.
#   mobile-release  → tag `mobile-v*` (any name) or by hand; the version is computed (MAJOR.MINOR of pubspec.yaml + build number):
#                     the checks once, then for Plazo AND Plazo Pro: signed AAB + APK (Android) and signed
#                     IPA (iOS), all four with the SAME version and build number; then every AAB goes to
#                     Google Play (production track, 21/10/2026) and every IPA to App Store Connect (TestFlight,
#                     then App Review and release), both with the notes of mobile/release-notes/, each
#                     upload attempted even when another failed, the build red if any did (last step).
#   mobile-release-android → by hand (11/10/2026, « un build Android seul pour le Play Store »): the same
#                     Android half of mobile-release (same steps, through the anchors below), without Apple:
#                     no iOS signing nor App Store Connect integration, so it runs before the Apple profiles
#                     exist, and when only Google Play needs a new version.
# The store uploads are done by the Codemagic CLI tools (google-play, app-store-connect) from scripts, not by a
# `publishing:` block: a block publishes the artifacts of one app only, and would upload twice if kept.
#
# Build number = Codemagic build counter + 100 (the counter only grows), and never below the last build already
# on any of the four store listings (two Google Play packages, two TestFlight apps).
#
# ── To set up once (detail: mobile/publier-sur-les-stores.md) ─────────────────────────────────────
#   Add the app to the existing account (Teams › Personal account, the one of Thempo), from GitHub, with
#   codemagic.yaml; check that pushes and tags reach it (app → Webhooks).
#   App › Environment variables, group « plazo_android_signing » (written by the GitHub workflow, see above):
#     CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD — Plazo's upload key, both apps.
#   Teams › Personal account › Code signing identities:
#     iOS certificate of the account (reference « thempo-distribution », as seen on 09/10/2026);
#     iOS provisioning profiles « plazo_app_store » (com.benfordtech.plazo) and « plazo_pro_app_store »
#     (com.benfordtech.plazopro), App Store profiles made in the Apple portal with that certificate,
#     then fetched or uploaded under exactly these reference names. mobile-release needs the certificate and
#     the two profiles before its first run: without one of them, Codemagic stops at « Set up code signing »
#     before building (mobile-release-android only needs the keystore group).
#   App › Environment variables, group « mobile_secrets »:
#     GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS = JSON key of the Google Cloud service account made for Yoon
#                                               (project yoon-beige, 13/10/2026), given access to both Plazo
#                                               apps in Play Console › Users and permissions (Releases
#                                               permissions); the name Yoon's app uses for the same key,
#                                               GCLOUD_SERVICE_ACCOUNT_CREDENTIALS, is read too
#     API_BASE_URL / SITE_URL                 = optional (https://www.plazo.fr/api is the app's default)
#     STRIPE_MERCHANT_ID                      = optional, Apple Pay merchant id, only once the Apple Pay
#                                               entitlement is in ios/Runner/Runner.entitlements
#     GOOGLE_SERVER_CLIENT_ID                 = optional (13/10/2026), Plazo Pro « Continuer avec Google » on
#                                               Android: the « Web application » OAuth client ID of the Google
#                                               Cloud project « Plazo » (public, the same as GOOGLE_CLIENT_IDS on
#                                               Vercel); absent = Plazo Pro Android without the Google button
#   Sign in with Apple (Plazo Pro, 13/10/2026): nothing to set here. Once the capability is enabled on the App ID
#   com.benfordtech.plazopro and the profile « plazo_pro_app_store » regenerated and fetched again under the same
#   reference name, mobile-release sees it in the profile, adds the entitlement for that build and turns the Apple
#   button on (step « Sign in with Apple »); before that, Plazo Pro builds without it.
#   The first upload of each app to Google Play is done by hand in the Play Console, with the .aab of the
#   first run of mobile-release-android or mobile-release (Artifacts); on that run the Google Play step of
#   that app ends in error ("Package not found"), the other uploads still happen, and the build ends red on
#   purpose.
# ────────────────────────────────────────────────────────────────────────────────────────────────

# ── Shared pieces (YAML anchors) ───────────────────────────────────────────────────────────────
definitions:
  env_versions_android: &env_versions_android
    # Same Flutter as the local checks and mobile-ci.yml (stable, October 2026).
    flutter: 3.47.6
    java: 17
    # The Xcode version picks the macOS image, hence the pool of Mac mini M2 machines, even for an Android
    # build. Pinned to 26.5 on 11/10/2026: the pool of the default image (26.6, `latest`) is overloaded since
    # 08/10/2026 and builds stayed queued for hours with nothing else running on the account
    # (github.com/orgs/codemagic-ci-cd/discussions/3570: Codemagic staff advise 26.5 or 26.4, users confirm
    # immediate starts, Android builds included; nothing on status.codemagic.io). Back to `latest` once the
    # queue is normal again.
    xcode: 26.5
  env_versions: &env_versions
    <<: *env_versions_android
    cocoapods: default

  # Billed minutes: keep the Gradle, pub and CocoaPods downloads between builds.
  cache: &cache
    cache_paths:
      - ~/.gradle/caches
      - $FLUTTER_ROOT/.pub-cache
      - $HOME/Library/Caches/CocoaPods

  # Environment of the Android packages, shared by mobile-release and mobile-release-android.
  android_vars: &android_vars
    # Identifiers of the two apps (android/app/build.gradle.kts).
    ANDROID_APPLICATION_ID_PLAZO: com.benfordtech.plazo
    ANDROID_APPLICATION_ID_PLAZO_PRO: com.benfordtech.plazopro
    # OneSignal apps (public, the same as ONESIGNAL_TRAVELLER_APP_ID / ONESIGNAL_APP_ID on Vercel).
    ONESIGNAL_APP_ID_PLAZO: dd3c2a74-a7b0-4117-ba18-ab5a1edfe0a3
    ONESIGNAL_APP_ID_PLAZO_PRO: 89a1124f-3ba0-481e-b9f1-545d254e435d
    # Google Play (21/10/2026, « les pipelines doivent publier en production avec release note »): the production
    # track, sent for Google's review and then released by itself, with the notes of release-notes/<app>.txt.
    # "internal" / "true" still work for a test build (Start new build › Environment variables).
    PLAY_TRACK: production
    PLAY_SUBMIT_AS_DRAFT: "false"
    # R8 runs out of heap on Codemagic machines (org.gradle.jvmargs is ignored there).
    JAVA_TOOL_OPTIONS: "-Xmx5g"

  scripts:
    - &flutter_packages
      name: Flutter packages
      script: flutter pub get
    - &checks
      name: Vérifications (nom du produit, analyse, tests)
      script: |
        set -e
        dart run tool/sync_product.dart --check
        flutter analyze
        flutter test
    - &android_key_properties
      name: key.properties depuis la clé d'import (groupe plazo_android_signing)
      # The group « plazo_android_signing » (written by the GitHub workflow android-keystore.yml) gives
      # CM_KEYSTORE (base64) / CM_KEYSTORE_PASSWORD / CM_KEY_ALIAS / CM_KEY_PASSWORD; the file is decoded here.
      # An `android_signing:` reference (Code signing identities) would give CM_KEYSTORE_PATH instead: also
      # accepted, for the day Plazo's key is uploaded there. android/app/build.gradle.kts reads key.properties.
      script: |
        set -e
        if [ -z "${CM_KEYSTORE_PATH:-}" ] && [ -n "${CM_KEYSTORE:-}" ]; then
          CM_KEYSTORE_PATH="$CM_BUILD_DIR/plazo-upload.jks"
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_KEYSTORE_PATH"
        fi
        [ -n "${CM_KEYSTORE_PATH:-}" ] && [ -s "$CM_KEYSTORE_PATH" ] \
          || { echo "ERREUR: clé d'import absente : groupe « plazo_android_signing » (CM_KEYSTORE…) non relié, voir android-keystore.yml"; exit 1; }
        for VAR in CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD; do
          eval "[ -n \"\${$VAR:-}\" ]" || { echo "ERREUR: $VAR absente du groupe « plazo_android_signing »"; exit 1; }
        done
        cat > "$CM_BUILD_DIR/mobile/android/key.properties" <<EOF
        storeFile=$CM_KEYSTORE_PATH
        storePassword=$CM_KEYSTORE_PASSWORD
        keyAlias=$CM_KEY_ALIAS
        keyPassword=$CM_KEY_PASSWORD
        EOF
        echo "Clé d'import prête"
    - &release_version
      name: Calculer la version (la même pour tous les paquets, jamais en dessous d'un store)
      script: |
        set -e
        # Automatic version (21/10/2026, « les versions se mettent à jour automatiquement »): MAJOR.MINOR from
        # pubspec.yaml (`version: 1.0.0+1` → 1.0, changed by hand only for a big step), the build number below as the
        # third number: every build publishes a new, higher version (1.0.131, 1.0.132…) without touching any file.
        BASE=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//' | cut -d. -f1,2)
        # The Play key under its CLI name, or under the name Yoon's app uses (13/10/2026: one service account for both).
        export GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS="${GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS:-${GCLOUD_SERVICE_ACCOUNT_CREDENTIALS:-}}"
        NEXT=$((PROJECT_BUILD_NUMBER + 100))
        # Never reuse a build number a store already knows (a re-run, a build made elsewhere): the same
        # number serves every package, so it goes above the last build of each of the four listings (the
        # Android-only workflow has no Apple app id nor key: its TestFlight numbers read 0).
        number() { case "$1" in ''|*[!0-9]*) echo 0 ;; *) echo "$1" ;; esac; }
        latest_play() { google-play get-latest-build-number --package-name "$1" 2>/dev/null || echo 0; }
        latest_testflight() { case "$1" in ''|0) echo 0 ;; *) app-store-connect get-latest-testflight-build-number "$1" 2>/dev/null || echo 0 ;; esac; }
        PLAY_PLAZO=$(number "$(latest_play "$ANDROID_APPLICATION_ID_PLAZO")")
        PLAY_PRO=$(number "$(latest_play "$ANDROID_APPLICATION_ID_PLAZO_PRO")")
        TF_PLAZO=$(number "$(latest_testflight "$APP_STORE_APP_ID_PLAZO")")
        TF_PRO=$(number "$(latest_testflight "$APP_STORE_APP_ID_PLAZO_PRO")")
        for LAST in "$PLAY_PLAZO" "$PLAY_PRO" "$TF_PLAZO" "$TF_PRO"; do
          [ "$LAST" -ge "$NEXT" ] && NEXT=$((LAST + 1))
        done
        VERSION_NAME="$BASE.$NEXT"
        echo "Version: $VERSION_NAME ($NEXT) — Google Play $PLAY_PLAZO / $PLAY_PRO, TestFlight $TF_PLAZO / $TF_PRO"
        echo "NEXT=$NEXT" >> "$CM_ENV"
        echo "VERSION_NAME=$VERSION_NAME" >> "$CM_ENV"
        # Build-time settings shared by the two apps (never secrets: they ship in the app).
        COMMON_DEFINES=""
        add_define() { COMMON_DEFINES="${COMMON_DEFINES:+$COMMON_DEFINES }--dart-define=$1=$2"; }
        [ -n "$API_BASE_URL" ] && add_define API_BASE_URL "$API_BASE_URL"
        [ -n "$SITE_URL" ] && add_define SITE_URL "$SITE_URL"
        [ -n "$STRIPE_MERCHANT_ID" ] && add_define STRIPE_MERCHANT_ID "$STRIPE_MERCHANT_ID"
        echo "COMMON_DEFINES=$COMMON_DEFINES" >> "$CM_ENV"
        : > "$CM_BUILD_DIR/publish-status.txt"
        # Release notes (21/10/2026): one text per app, mobile/release-notes/<app>.txt, in French, kept up to date with
        # the app (what changes since the last version). Missing or empty stops here, before 40 minutes of builds.
        # 500 characters at most (Google Play's limit; the App Store takes 4 000).
        for SLUG in plazo plazo-pro; do
          NOTES="release-notes/$SLUG.txt"
          [ -s "$NOTES" ] || { echo "ERREUR: notes de version absentes : mobile/$NOTES (texte en français de ce qui change pour $SLUG)"; exit 1; }
          python3 - "$NOTES" "$CM_BUILD_DIR/release-notes-$SLUG" <<'PY'
        import json, sys
        text = open(sys.argv[1], encoding="utf-8").read().strip()
        if not text or len(text) > 500:
            sys.exit(f"ERREUR: {sys.argv[1]} : {len(text)} caractères, 1 à 500 attendus (limite de Google Play)")
        open(sys.argv[2] + ".txt", "w", encoding="utf-8").write(text)
        json.dump([{"language": "fr-FR", "text": text}], open(sys.argv[2] + ".json", "w", encoding="utf-8"), ensure_ascii=False)
        PY
          echo "Notes de version $SLUG :"; cat "$CM_BUILD_DIR/release-notes-$SLUG.txt"; echo
        done
    - &android_build
      name: Android — AAB (Play) + APK des deux apps (release, signés, versionnés)
      script: |
        set -e
        for FLAVOR in traveller pro; do
          # Plazo Pro on Android (13/10/2026): « Continuer avec Google » needs the Web client ID (empty: no button).
          case "$FLAVOR" in
            traveller) SLUG=plazo; ONESIGNAL="$ONESIGNAL_APP_ID_PLAZO"; EXTRA="" ;;
            pro) SLUG=plazo-pro; ONESIGNAL="$ONESIGNAL_APP_ID_PLAZO_PRO"; EXTRA="--dart-define=GOOGLE_SERVER_CLIENT_ID=${GOOGLE_SERVER_CLIENT_ID:-}" ;;
          esac
          [ -n "$ONESIGNAL" ] || echo "ATTENTION: pas d'app OneSignal pour $FLAVOR, les notifications de cette version seront coupées"
          if [ "$FLAVOR" = "pro" ] && [ -z "${GOOGLE_SERVER_CLIENT_ID:-}" ]; then
            echo "ATTENTION: GOOGLE_SERVER_CLIENT_ID absent : Plazo Pro Android sans « Continuer avec Google »"
          fi
          DEFINES="--dart-define=APP_FLAVOR=$FLAVOR --dart-define=ONESIGNAL_APP_ID=$ONESIGNAL $COMMON_DEFINES $EXTRA"
          echo "── $SLUG (Android, $VERSION_NAME+$NEXT)"
          flutter build appbundle --release --flavor "$FLAVOR" --build-number="$NEXT" --build-name="$VERSION_NAME" $DEFINES
          flutter build apk --release --flavor "$FLAVOR" --build-number="$NEXT" --build-name="$VERSION_NAME" $DEFINES
          mv "build/app/outputs/bundle/${FLAVOR}Release/app-$FLAVOR-release.aab" "build/app/outputs/bundle/${FLAVOR}Release/$SLUG-v$VERSION_NAME-$NEXT.aab"
          mv "build/app/outputs/flutter-apk/app-$FLAVOR-release.apk" "build/app/outputs/flutter-apk/$SLUG-v$VERSION_NAME-$NEXT.apk"
        done
        ls -1 build/app/outputs/bundle/*/*.aab build/app/outputs/flutter-apk/*.apk
    - &play_upload
      name: Google Play — envoi des deux AAB (production, avec les notes de version)
      # Every AAB is sent even when one fails; the last step turns the build red if any did.
      ignore_failure: true
      script: |
        # The Play key under its CLI name, or under the name Yoon's app uses (13/10/2026: one service account for both).
        export GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS="${GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS:-${GCLOUD_SERVICE_ACCOUNT_CREDENTIALS:-}}"
        DRAFT_FLAG=""
        [ "$PLAY_SUBMIT_AS_DRAFT" = "true" ] && DRAFT_FLAG="--draft"
        for AAB in build/app/outputs/bundle/*/*.aab; do
          NAME=$(basename "$AAB" .aab)
          SLUG="${NAME%-v$VERSION_NAME-$NEXT}"
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS" ]; then
            echo "KO  Google Play  $NAME (clé du compte de service absente du groupe mobile_secrets : GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS ou GCLOUD_SERVICE_ACCOUNT_CREDENTIALS)" >> "$CM_BUILD_DIR/publish-status.txt"
            continue
          fi
          # Two tries (13/10/2026, build 115): a change made in the Play Console during the upload cancels the API's
          # edit (« A change was made to the application outside of this Edit »); the bundle of a cancelled edit is not
          # kept, so the same version code can be sent again.
          SENT=""
          for TRY in 1 2; do
            if google-play bundles publish --bundle "$AAB" --track "$PLAY_TRACK" --release-name "$VERSION_NAME ($NEXT)" \
              --release-notes "@file:$CM_BUILD_DIR/release-notes-$SLUG.json" $DRAFT_FLAG; then
              SENT=yes
              break
            fi
            [ "$TRY" = 1 ] && { echo "Nouvel essai de $NAME dans 60 s"; sleep 60; }
          done
          if [ -n "$SENT" ]; then
            echo "OK  Google Play  $NAME ($PLAY_TRACK)" >> ""$CM_BUILD_DIR/publish-status.txt"
          else
            echo "KO  Google Play  $NAME" >> "$CM_BUILD_DIR/publish-status.txt"
          fi
        done
    - &publish_summary
      name: Bilan de la publication
      script: |
        echo "Version $VERSION_NAME ($NEXT)"
        cat "$CM_BUILD_DIR/publish-status.txt"
        if grep -q '^KO' "$CM_BUILD_DIR/publish-status.txt"; then
          echo "ERREUR: un envoi a échoué (voir ci-dessus) ; les paquets restent dans Artifacts"
          exit 1
        fi
        [ -s "$CM_BUILD_DIR/publish-status.txt" ] || { echo "ERREUR: aucun envoi tenté"; exit 1; }

# ── Workflows ──────────────────────────────────────────────────────────────────────────────────
workflows:
  mobile-check:
    name: Mobile — vérifications + APK de test (debug, à la main)
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: mobile
    environment:
      <<: *env_versions
    cache: *cache
    # No triggering: started by hand when test APKs are wanted (the push checks run on GitHub Actions).
    scripts:
      - *flutter_packages
      - *checks
      - name: Android — APK de test des deux apps (debug, non signés pour le store)
        script: |
          set -e
          flutter build apk --debug --flavor traveller --dart-define=APP_FLAVOR=traveller
          flutter build apk --debug --flavor pro --dart-define=APP_FLAVOR=pro
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  mobile-release:
    name: Plazo + Plazo Pro — APK, AAB, IPA → Google Play + App Store (production, notes de version)
    instance_type: mac_mini_m2
    # Two Android apps (~12 min each with the cache) and two iOS apps (~20 min each), checks once, then up to
    # 30 min per app waiting for Apple to process the build before submitting it for review.
    max_build_duration: 180
    working_directory: mobile
    integrations:
      # Teams › Personal account › Integrations › Developer Portal: the App Store Connect API key of the Apple team (shared with
      # LoveNest and Thempo). Gives the app-store-connect tool its APP_STORE_CONNECT_* variables.
      app_store_connect: lovenest-asc
    environment:
      <<: *env_versions
      ios_signing:
        # Teams › Personal account › Code signing identities: the account's certificate and the App Store profile of EACH bundle id,
        # by reference name (an automatic `bundle_identifier` only takes one app per workflow).
        certificates:
          - thempo-distribution
        provisioning_profiles:
          - plazo_app_store
          - plazo_pro_app_store
      groups:
        - mobile_secrets
        # Plazo's upload keystore, as secure variables (written by the GitHub workflow android-keystore.yml).
        - plazo_android_signing
      vars:
        <<: *android_vars
        # Identifiers of the two apps on iOS (ios/Runner.xcodeproj).
        IOS_BUNDLE_ID_PLAZO: com.benfordtech.plazo
        IOS_BUNDLE_ID_PLAZO_PRO: com.benfordtech.plazopro
        # Numeric Apple ID of each app in App Store Connect (App Information → Apple ID, both records
        # created on 11/10/2026), used only to read the last TestFlight build number ("0" = not read).
        APP_STORE_APP_ID_PLAZO: "6821635235"
        APP_STORE_APP_ID_PLAZO_PRO: "6821635650"
        # TestFlight: internal testers get every build. To also submit the builds to Apple's beta review for
        # external testers (needs the test information filled in; stalled Thempo), add
        #   TESTFLIGHT_BETA_GROUPS: "Group A, Group B"
        # (beta group names, separated by commas). Absent = no beta review: Codemagic refuses an empty value.
        # App Store (21/10/2026): every IPA is also submitted for App Review as version $VERSION_NAME, with the notes
        # of release-notes/<app>.txt as « What's new » (fr-FR), and released by itself once approved.
        # APP_STORE_SUBMIT "false" = TestFlight only; APP_STORE_RELEASE_TYPE MANUAL = release by hand after approval.
        APP_STORE_SUBMIT: "true"
        APP_STORE_RELEASE_TYPE: AFTER_APPROVAL
    cache: *cache
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'mobile-v*'
          include: true
      cancel_previous_builds: true
    scripts:
      - *android_key_properties
      - *release_version
      - *flutter_packages
      - *checks
      - *android_build
      - name: Sign in with Apple (Plazo Pro) selon son profil App Store
        # 13/10/2026: Plazo Pro shows « Continuer avec Apple » only when its App Store profile (plazo_pro_app_store)
        # carries the « Sign in with Apple » capability. Then the entitlement is added to RunnerPro.entitlements for
        # this build only (never committed: signing with a profile that lacks it would fail) and the IPA gets
        # --dart-define=APPLE_SIGN_IN=true. Without it (profile not regenerated yet), a warning, and the build goes
        # on without the Apple button.
        script: |
          set -e
          ENTITLEMENTS="ios/Runner/RunnerPro.entitlements"
          FOUND=""
          # Where ios_signing installs the profiles: the older folder, and the one of Xcode 16 and later.
          for PROFILE in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision; do
            [ -f "$PROFILE" ] || continue
            DECODED="$(mktemp)"
            if ! security cms -D -i "$PROFILE" > "$DECODED" 2>/dev/null; then rm -f "$DECODED"; continue; fi
            APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$DECODED" 2>/dev/null || true)
            case "$APP_ID" in
              *".$IOS_BUNDLE_ID_PLAZO_PRO")
                if /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.applesignin" "$DECODED" >/dev/null 2>&1; then
                  FOUND="$PROFILE"
                fi
                ;;
            esac
            rm -f "$DECODED"
          done
          if [ -n "$FOUND" ]; then
            /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.applesignin" "$ENTITLEMENTS" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin array" -c "Add :com.apple.developer.applesignin:0 string Default" "$ENTITLEMENTS"
            echo "APPLE_SIGN_IN_DEFINE=--dart-define=APPLE_SIGN_IN=true" >> "$CM_ENV"
            echo "Sign in with Apple : capacité présente dans le profil de Plazo Pro, bouton « Continuer avec Apple » activé"
          else
            echo "ATTENTION: le profil App Store de Plazo Pro ($IOS_BUNDLE_ID_PLAZO_PRO) n'a pas la capacité « Sign in with Apple » : Plazo Pro est construit sans le bouton Apple (activer la capacité sur l'App ID, régénérer le profil plazo_pro_app_store puis le recharger dans Codemagic sous le même nom)"
          fi
      - name: Profils de signature dans le projet Xcode (les deux apps)
        # ios_signing has put the account's certificate and the two App Store profiles in the keychain; the App
        # ID of each needs Push Notifications (both apps) and Associated Domains (Plazo only); Sign in with Apple
        # on Plazo Pro is optional (previous step). One export options plist per app: each keeps only the profile
        # of its own bundle id.
        script: |
          set -e
          xcode-project use-profiles
          PLIST="$HOME/export_options.plist"
          for BID in "$IOS_BUNDLE_ID_PLAZO" "$IOS_BUNDLE_ID_PLAZO_PRO"; do
            /usr/libexec/PlistBuddy -c "Print :provisioningProfiles:$BID" "$PLIST" >/dev/null 2>&1 \
              || { echo "ERREUR: aucun profil App Store pour $BID dans Teams › Personal account › Code signing identities (plazo_app_store / plazo_pro_app_store)"; exit 1; }
          done
          cp "$PLIST" "$HOME/export_options_traveller.plist"
          /usr/libexec/PlistBuddy -c "Delete :provisioningProfiles:$IOS_BUNDLE_ID_PLAZO_PRO" "$HOME/export_options_traveller.plist"
          cp "$PLIST" "$HOME/export_options_pro.plist"
          /usr/libexec/PlistBuddy -c "Delete :provisioningProfiles:$IOS_BUNDLE_ID_PLAZO" "$HOME/export_options_pro.plist"
      - name: iOS — IPA des deux apps (release, signés, versionnés)
        script: |
          set -e
          mkdir -p build/ios/dsym
          for FLAVOR in traveller pro; do
            # Plazo Pro: « Continuer avec Apple » when the previous steps found the capability in its profile.
            case "$FLAVOR" in
              traveller) SLUG=plazo; ONESIGNAL="$ONESIGNAL_APP_ID_PLAZO"; EXTRA="" ;;
              pro) SLUG=plazo-pro; ONESIGNAL="$ONESIGNAL_APP_ID_PLAZO_PRO"; EXTRA="${APPLE_SIGN_IN_DEFINE:-}" ;;
            esac
            DEFINES="--dart-define=APP_FLAVOR=$FLAVOR --dart-define=ONESIGNAL_APP_ID=$ONESIGNAL $COMMON_DEFINES $EXTRA"
            echo "── $SLUG (iOS, $VERSION_NAME+$NEXT)"
            flutter build ipa --release --flavor "$FLAVOR" --build-number="$NEXT" --build-name="$VERSION_NAME" $DEFINES \
              --export-options-plist="$HOME/export_options_$FLAVOR.plist"
            # The IPA just exported is the one not yet named after its app.
            for IPA in build/ios/ipa/*.ipa; do
              case "$IPA" in *"-v$VERSION_NAME-$NEXT.ipa") ;; *) mv "$IPA" "build/ios/ipa/$SLUG-v$VERSION_NAME-$NEXT.ipa" ;; esac
            done
            # The archive's debug symbols, kept per app (the next archive overwrites this one).
            cp -R build/ios/archive/*.xcarchive/dSYMs "build/ios/dsym/$SLUG-v$VERSION_NAME-$NEXT"
          done
          ls -1 build/ios/ipa/*.ipa
      - *play_upload
      - name: App Store Connect — envoi des deux IPA (TestFlight puis revue App Store, notes de version)
        ignore_failure: true
        script: |
          FLAGS=""
          if [ "$APP_STORE_SUBMIT" = "true" ]; then
            # Waits for Apple's processing (30 min at most), then creates or updates the App Store version and
            # submits it, replacing a submission of an older build still waiting.
            FLAGS="--app-store --platform IOS --version-string $VERSION_NAME --release-type $APP_STORE_RELEASE_TYPE --cancel-previous-submissions --max-build-processing-wait 30"
            [ -n "$TESTFLIGHT_BETA_GROUPS" ] && FLAGS="$FLAGS --testflight"
            [ -n "$TESTFLIGHT_BETA_GROUPS" ] && { IFS=','; for GROUP in $TESTFLIGHT_BETA_GROUPS; do FLAGS="$FLAGS --beta-group \"$(echo "$GROUP" | sed 's/^ *//; s/ *$//')\""; done; unset IFS; }
          elif [ -n "$TESTFLIGHT_BETA_GROUPS" ]; then
            FLAGS="--testflight"
            IFS=','; for GROUP in $TESTFLIGHT_BETA_GROUPS; do FLAGS="$FLAGS --beta-group \"$(echo "$GROUP" | sed 's/^ *//; s/ *$//')\""; done; unset IFS
          else
            # No beta review: nothing to wait for once Apple has the file.
            FLAGS="--max-build-processing-wait 0"
          fi
          for IPA in build/ios/ipa/*.ipa; do
            NAME=$(basename "$IPA" .ipa)
            SLUG="${NAME%-v$VERSION_NAME-$NEXT}"
            WHERE="TestFlight"; [ "$APP_STORE_SUBMIT" = "true" ] && WHERE="App Store"
            if eval app-store-connect publish --path "\"$IPA\"" $FLAGS \
              --locale fr-FR --whats-new "\"@file:$CM_BUILD_DIR/release-notes-$SLUG.txt\""; then
              echo "OK  $WHERE   $NAME" >> "$CM_BUILD_DIR/publish-status.txt"
            else
              echo "KO  $WHERE   $NAME" >> "$CM_BUILD_DIR/publish-status.txt"
            fi
          done
      - *publish_summary
    artifacts:
      - build/app/outputs/bundle/*/*.aab
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/mapping/*/mapping.txt
      - build/ios/ipa/*.ipa
      - build/ios/dsym/*/*.dSYM

  mobile-release-android:
    name: Plazo + Plazo Pro — Android seul (APK, AAB) → Google Play (production, notes de version)
    # Same machine as mobile-release: the only one the account's free minutes cover (Linux needs billing), and
    # the shared cache already runs there.
    instance_type: mac_mini_m2
    # Two Android apps (~12 min each with the cache), checks once.
    max_build_duration: 60
    working_directory: mobile
    environment:
      <<: *env_versions_android
      groups:
        - mobile_secrets
        # Plazo's upload keystore, as secure variables (written by the GitHub workflow android-keystore.yml).
        - plazo_android_signing
      vars:
        <<: *android_vars
    cache: *cache
    # No triggering: started by hand (Start new build › this workflow), the tag `mobile-v*` building both stores.
    scripts:
      - *android_key_properties
      - *release_version
      - *flutter_packages
      - *checks
      - *android_build
      - *play_upload
      - *publish_summary
    artifacts:
      - build/app/outputs/bundle/*/*.aab
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/mapping/*/mapping.txt
